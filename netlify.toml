[build]
  functions = "netlify/functions"
  # NOTIFY_WHATSAPP_NUMBER no es un secreto real -- es el mismo número de
  # WhatsApp del negocio que ya aparece público en el sitio (CONFIG.WHATSAPP_NUMBER
  # en app.js, botón "Hablar con Mae"), por eso el escáner de secretos de
  # Netlify lo detecta como coincidencia y bloquea el deploy. Se excluye
  # explícitamente porque no hay nada que proteger.
  #
  # GOOGLE_SHEETS_STOCK_TAB / GOOGLE_SHEETS_CONFIG_TAB tampoco son
  # secretos reales -- son solo nombres de pestañas de Google Sheets
  # (ej. "Stock", "Config"), y esas palabras aparecen por todo el sitio
  # para cosas que no tienen nada que ver (badges "en stock", el objeto
  # CONFIG de app.js, etc.), así que el escáner las marca por error en
  # decenas de archivos.

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NOTIFY_WHATSAPP_NUMBER,GOOGLE_SHEETS_STOCK_TAB,GOOGLE_SHEETS_CONFIG_TAB"

# "Candados" de navegador estándar -- protegen contra que alguien
# incruste el sitio en otra página (clickjacking), fuerzan HTTPS, y
# limitan de dónde se puede cargar código/estilos/imágenes (CSP). Todos
# los <script> del sitio ya son archivos externos (app.js, admin.js,
# scroll-fix.js, legal-year.js) para poder usar script-src 'self' sin
# 'unsafe-inline'. style-src sí necesita 'unsafe-inline' porque
# admin.html usa varios atributos style="" en línea.
#
# connect-src incluye docs.google.com porque el catálogo y el stock se
# leen directo desde el navegador del cliente (CSV publicado de Google
# Sheets), no a través de una función de Netlify.
#
# El CSP NO lleva "frame-ancestors 'none'" a propósito -- en Safari
# (WebKit) esa directiva, combinada con el <iframe src="blob:..."> del
# visor de comprobantes de pago (ver admin.js), hace que Safari rechace
# cargar el blob: con el error "does not appear in the frame-ancestors
# directive", dejando el visor vacío (bug/comportamiento no estándar de
# WebKit -- frame-ancestors debería controlar solo quién puede incrustar
# ESTA página, no qué puede cargar esta página). Confirmado quitándola:
# el visor funciona en Safari sin ese error. La protección contra
# clickjacking no se pierde porque X-Frame-Options: DENY (arriba) ya
# cubre exactamente lo mismo, y sí es compatible con todos los
# navegadores sin este problema.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
