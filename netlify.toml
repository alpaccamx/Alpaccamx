[build]
  functions = "netlify/functions"
  # NOTIFY_WHATSAPP_NUMBER no es un secreto real -- es el mismo número de
  # WhatsApp del negocio que ya aparece público en el sitio (CONFIG.WHATSAPP_NUMBER
  # en app.js, botón "Hablar con Mae"), por eso el escáner de secretos de
  # Netlify lo detecta como coincidencia y bloquea el deploy. Se excluye
  # explícitamente porque no hay nada que proteger.
  #
  # GOOGLE_SHEETS_STOCK_TAB tampoco es un secreto real -- es solo el
  # nombre de una pestaña de Google Sheets (ej. "Stock"), y esa palabra
  # aparece por todo el sitio para funciones que no tienen nada que ver
  # (badges "en stock", etc.), así que el escáner la marca por error en
  # decenas de archivos.

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NOTIFY_WHATSAPP_NUMBER,GOOGLE_SHEETS_STOCK_TAB"
