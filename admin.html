<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Alpacca — Panel de pedidos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf6f2;
    color: #2b2b2b;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #777; font-size: 13px; margin: 0 0 20px; }
  .login-box, .toolbar {
    max-width: 720px;
    margin: 0 auto 20px;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .login-box input, .toolbar input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
    margin-bottom: 10px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-weight: 600;
    font-size: 14px;
  }
  .btn-primary { background: #e07a8f; color: #fff; }
  .btn-secondary { background: #eee; color: #333; }
  .btn-danger { background: #d9534f; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #orders { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .order-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .order-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .badge.whatsapp { background: #dcf8e8; color: #17803d; }
  .badge.mercadopago { background: #dbeeff; color: #0b6bc2; }
  .order-card ul { margin: 10px 0; padding-left: 18px; font-size: 13px; }
  .order-card .total { font-weight: 700; margin-top: 6px; }
  .order-card .customer { font-size: 13px; color: #555; margin-top: 8px; }
  .order-card .actions { margin-top: 12px; display: flex; gap: 8px; }
  #empty, #status { text-align: center; color: #888; font-size: 14px; margin-top: 30px; }
</style>
</head>
<body>
  <h1>Panel de pedidos pendientes</h1>
  <p class="sub">Pedidos por transferencia (WhatsApp) esperando confirmación de pago, y pagos de Mercado Pago que quedaron a medias.</p>

  <div class="login-box" id="login-box">
    <input id="admin-key-input" type="password" placeholder="Clave de administrador" />
    <button class="btn-primary" id="login-btn">Entrar</button>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <button class="btn-secondary" id="refresh-btn">🔄 Actualizar</button>
    <button class="btn-secondary" id="logout-btn">Cerrar sesión</button>
  </div>

  <p id="status" style="display:none;"></p>
  <p id="empty" style="display:none;">No hay pedidos pendientes 🎉</p>
  <div id="orders"></div>

  <script>
    const KEY_STORAGE = "alpacca_admin_key";
    let adminKey = "";

    const loginBox = document.getElementById("login-box");
    const toolbar = document.getElementById("toolbar");
    const ordersEl = document.getElementById("orders");
    const statusEl = document.getElementById("status");
    const emptyEl = document.getElementById("empty");

    function formatPrice(n) {
      return (n || 0).toLocaleString("es-MX", { style: "currency", currency: "MXN" });
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
      statusEl.style.display = msg ? "block" : "none";
    }

    async function fetchOrders() {
      setStatus("Cargando...");
      emptyEl.style.display = "none";
      ordersEl.innerHTML = "";
      try {
        const res = await fetch("/.netlify/functions/admin-orders", {
          headers: { "x-admin-key": adminKey },
        });
        if (res.status === 401) {
          setStatus("Clave incorrecta.");
          logout();
          return;
        }
        const data = await res.json();
        if (!res.ok) {
          setStatus(data.error || "Error cargando pedidos.");
          return;
        }
        setStatus("");
        renderOrders(data.orders || []);
      } catch (err) {
        setStatus("No se pudo conectar con el servidor.");
      }
    }

    function renderOrders(orders) {
      if (!orders.length) {
        emptyEl.style.display = "block";
        return;
      }
      ordersEl.innerHTML = orders.map((o) => orderCardHTML(o)).join("");

      ordersEl.querySelectorAll("[data-confirm]").forEach((btn) => {
        btn.addEventListener("click", () => confirmOrCancel(btn.dataset.confirm, "confirm"));
      });
      ordersEl.querySelectorAll("[data-cancel]").forEach((btn) => {
        btn.addEventListener("click", () => confirmOrCancel(btn.dataset.cancel, "cancel"));
      });
    }

    function orderCardHTML(o) {
      const sourceLabel = o.source === "mercadopago" ? "Mercado Pago (sin pagar)" : "WhatsApp / transferencia";
      const items = (o.items || [])
        .map((it) => `<li>${escapeHtml(it.nombre)} x${it.qty}${it.enStock ? " · en stock" : ""} — ${formatPrice(it.precio * it.qty)}</li>`)
        .join("");
      const fecha = o.createdAt ? new Date(o.createdAt).toLocaleString("es-MX") : "";
      return `
        <div class="order-card">
          <div class="top">
            <span class="badge ${o.source}">${sourceLabel}</span>
            <span style="font-size:12px;color:#999;">${fecha}</span>
          </div>
          <ul>${items}</ul>
          <div class="total">Total: ${formatPrice(o.grandTotal)}</div>
          <div class="customer">
            ${escapeHtml(o.customer?.name || "(sin nombre)")}
            ${o.customer?.phone ? " · " + escapeHtml(o.customer.phone) : ""}
            ${o.customer?.cp ? " · CP " + escapeHtml(o.customer.cp) : ""}
          </div>
          <div class="actions">
            <button class="btn-primary" data-confirm="${o.id}">✅ Confirmar pago (descuenta stock)</button>
            <button class="btn-danger" data-cancel="${o.id}">✕ Cancelar</button>
          </div>
        </div>`;
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    async function confirmOrCancel(orderId, action) {
      setStatus(action === "confirm" ? "Confirmando..." : "Cancelando...");
      try {
        const res = await fetch("/.netlify/functions/admin-confirm-order", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-key": adminKey },
          body: JSON.stringify({ orderId, action }),
        });
        const data = await res.json();
        if (!res.ok) {
          setStatus(data.error || "Error al actualizar el pedido.");
          return;
        }
        fetchOrders();
      } catch (err) {
        setStatus("No se pudo conectar con el servidor.");
      }
    }

    function login() {
      const value = document.getElementById("admin-key-input").value.trim();
      if (!value) return;
      adminKey = value;
      sessionStorage.setItem(KEY_STORAGE, value);
      loginBox.style.display = "none";
      toolbar.style.display = "flex";
      toolbar.style.gap = "8px";
      fetchOrders();
    }

    function logout() {
      adminKey = "";
      sessionStorage.removeItem(KEY_STORAGE);
      loginBox.style.display = "block";
      toolbar.style.display = "none";
      ordersEl.innerHTML = "";
      emptyEl.style.display = "none";
    }

    document.getElementById("login-btn").addEventListener("click", login);
    document.getElementById("admin-key-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
    document.getElementById("refresh-btn").addEventListener("click", fetchOrders);
    document.getElementById("logout-btn").addEventListener("click", logout);

    const savedKey = sessionStorage.getItem(KEY_STORAGE);
    if (savedKey) {
      adminKey = savedKey;
      loginBox.style.display = "none";
      toolbar.style.display = "flex";
      toolbar.style.gap = "8px";
      fetchOrders();
    }
  </script>
</body>
</html>
